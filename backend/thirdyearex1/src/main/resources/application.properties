spring.application.name=thirdyearex1

# Database Configuration (Environment variables with local fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movie_booking}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:MySecretKeyForMovieBookingProject12345678901234567890}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Server Configuration
server.port=${PORT:8081}

# CORS Configuration
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}